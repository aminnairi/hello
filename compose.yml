services:
  hello-proxy:
    container_name: hello-proxy
    restart: unless-stopped
    image: nginx:1.29.4-alpine3.23
    volumes:
      - ./applications/reverseproxy/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
  hello-server:
    container_name: hello-server
    restart: unless-stopped
    image: node:25.2.1-alpine3.22
    user: node
    working_dir: /home/node
    tty: true
    stdin_open: true
    command: sh -c 'npm install && npm -w applications/server run dev'
    environment:
      SERVER_WEB_URL: http://localhost:8001
    volumes:
      - .:/home/node
  hello-web:
    container_name: hello-web
    restart: unless-stopped
    image: node:25.2.1-alpine3.22
    user: node
    working_dir: /home/node
    command: sh -c 'npm install && npm -w applications/web run dev'
    tty: true
    stdin_open: true
    volumes:
      - .:/home/node
